<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rune Lexicon</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-[#F0E6D2] min-h-screen font-serif">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const STORAGE_KEY = "lol-hanzi-entries-v3";
const FOLDERS_KEY = "lol-hanzi-folders-v3";

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function LolDictionary() {
  const [entries, setEntries] = useState([]);
  const [folders, setFolders] = useState(["Tất cả", "Chung", "Tướng", "Kỹ năng"]);
  const [activeFolder, setActiveFolder] = useState("Tất cả");
  
  const [loaded, setLoaded] = useState(false);
  const [query, setQuery] = useState("");
  const [filter, setFilter] = useState("");
  const [looking, setLooking] = useState(false);
  const [lookupError, setLookupError] = useState("");
  
  const [editingId, setEditingId] = useState(null);
  const [editDraft, setEditDraft] = useState({ pinyin: "", meaning: "", note: "", folder: "Chung" });
  
  const [manualOpen, setManualOpen] = useState(false);
  const [manualDraft, setManualDraft] = useState({ word: "", pinyin: "", meaning: "", note: "", folder: "Chung" });
  
  const [newFolderModal, setNewFolderModal] = useState(false);
  const [newFolderName, setNewFolderName] = useState("");
  const [toast, setToast] = useState("");

  useEffect(() => {
    try {
      const rawEntries = localStorage.getItem(STORAGE_KEY);
      if (rawEntries) setEntries(JSON.parse(rawEntries));
      const rawFolders = localStorage.getItem(FOLDERS_KEY);
      if (rawFolders) setFolders(JSON.parse(rawFolders));
    } catch (e) {}
    setLoaded(true);
  }, []);

  function persistEntries(next) {
    setEntries(next);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(next)); } catch (e) {}
  }

  function persistFolders(nextFolders) {
    setFolders(nextFolders);
    try { localStorage.setItem(FOLDERS_KEY, JSON.stringify(nextFolders)); } catch (e) {}
  }

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(""), 2500);
  }

  function handleCreateFolder() {
    const name = newFolderName.trim();
    if (!name) return;
    if (folders.includes(name)) {
      showToast("Thư mục này đã tồn tại!");
      return;
    }
    persistFolders([...folders, name]);
    setNewFolderName("");
    setNewFolderModal(false);
    showToast(`Đã tạo thư mục "${name}"`);
  }

  async function handleLookup() {
    const word = query.trim();
    if (!word) return;
    setLookupError("");
    setLooking(true);
    try {
      const response = await fetch("/api/lookup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ word, folders }),
      });
      const parsed = await response.json();
      if (!response.ok) throw new Error(parsed.error || "API lỗi");

      let targetFolder = parsed.folder && folders.includes(parsed.folder) ? parsed.folder : "Chung";
      const existingIdx = entries.findIndex((e) => e.word === word);
      const newEntry = {
        id: existingIdx >= 0 ? entries[existingIdx].id : uid(),
        word,
        pinyin: parsed.pinyin || "",
        meaning: parsed.meaning || "",
        note: parsed.note || "",
        folder: existingIdx >= 0 ? entries[existingIdx].folder : targetFolder,
        createdAt: existingIdx >= 0 ? entries[existingIdx].createdAt : Date.now(),
      };
      
      const next = existingIdx >= 0 ? entries.map((e, idx) => idx === existingIdx ? newEntry : e) : [newEntry, ...entries];
      persistEntries(next);
      setQuery("");
      showToast(existingIdx >= 0 ? "Đã cập nhật lại từ" : `Đã phân loại vào [${newEntry.folder}]`);
    } catch (e) {
      setLookupError(e.message || "Không tra cứu được từ này.");
    } finally {
      setLooking(false);
    }
  }

  function startEdit(entry) {
    setEditingId(entry.id);
    setEditDraft({ pinyin: entry.pinyin, meaning: entry.meaning, note: entry.note, folder: entry.folder || "Chung" });
  }

  function saveEdit(id) {
    persistEntries(entries.map((e) => (e.id === id ? { ...e, ...editDraft } : e)));
    setEditingId(null);
    showToast("Đã lưu chỉnh sửa");
  }

  function deleteEntry(id) {
    persistEntries(entries.filter((e) => e.id !== id));
    showToast("Đã xoá từ");
  }

  function addManual() {
    const word = manualDraft.word.trim();
    if (!word) return;
    const existingIdx = entries.findIndex((e) => e.word === word);
    const entry = {
      id: existingIdx >= 0 ? entries[existingIdx].id : uid(),
      word,
      pinyin: manualDraft.pinyin.trim(),
      meaning: manualDraft.meaning.trim(),
      note: manualDraft.note.trim(),
      folder: manualDraft.folder || "Chung",
      createdAt: existingIdx >= 0 ? entries[existingIdx].createdAt : Date.now(),
    };
    const next = existingIdx >= 0 ? entries.map((e, idx) => idx === existingIdx ? entry : e) : [entry, ...entries];
    persistEntries(next);
    setManualDraft({ word: "", pinyin: "", meaning: "", note: "", folder: "Chung" });
    setManualOpen(false);
    showToast("Đã thêm từ mới");
  }

  const filtered = entries.filter((e) => {
    if (activeFolder !== "Tất cả" && e.folder !== activeFolder) return false;
    const q = filter.trim().toLowerCase();
    if (!q) return true;
    return e.word.toLowerCase().includes(q) || e.pinyin.toLowerCase().includes(q) || e.meaning.toLowerCase().includes(q);
  });

  return (
    <div className="max-w-xl mx-auto px-4 py-8 min-h-screen relative">
      <header className="text-center mb-6">
        <div className="flex items-center justify-center gap-2">
          <span className="text-xl">⚔️</span>
          <h1 className="text-2xl font-bold tracking-wide text-[#F0E6D2]">Rune Lexicon</h1>
        </div>
        <p className="text-xs text-slate-400 mt-1 font-sans">Từ điển Hán ngữ · Thuật ngữ LMHT (AI Auto-Folder)</p>
      </header>

      {/* Thư mục */}
      <div className="flex gap-2 items-center overflow-x-auto pb-2 mb-4">
        <div className="flex gap-1.5 overflow-x-auto flex-1">
          {folders.map((f) => (
            <button
              key={f}
              onClick={() => setActiveFolder(f)}
              className={`px-3 py-1.5 rounded text-xs font-sans whitespace-nowrap border transition ${
                activeFolder === f 
                  ? "bg-[#C89B3C] text-slate-950 border-[#C89B3C] font-bold" 
                  : "bg-slate-900/60 border-slate-700 text-slate-400 hover:border-slate-500"
              }`}
            >
              📁 {f} {f !== "Tất cả" && `(${entries.filter(e => e.folder === f).length})`}
            </button>
          ))}
        </div>
        <button onClick={() => setNewFolderModal(true)} className="px-2.5 py-1.5 rounded text-xs font-sans border border-dashed border-[#0AC8B9] text-[#0AC8B9] whitespace-nowrap hover:bg-[#0AC8B9]/10">
          + Thư mục
        </button>
      </div>

      {newFolderModal && (
        <div className="bg-slate-900/90 border border-[#0AC8B9] rounded p-3 mb-4">
          <h3 className="text-xs font-bold text-[#0AC8B9] mb-2 font-sans">Tạo thư mục mới</h3>
          <div className="flex gap-2">
            <input
              type="text"
              placeholder="Tên thư mục..."
              value={newFolderName}
              onChange={(e) => setNewFolderName(e.target.value)}
              className="flex-1 bg-slate-950 border border-slate-700 rounded px-3 py-1.5 text-xs text-[#F0E6D2] outline-none focus:border-[#0AC8B9]"
            />
            <button onClick={handleCreateFolder} className="bg-[#0AC8B9] text-slate-950 font-bold px-3 py-1.5 rounded text-xs font-sans">Tạo</button>
            <button onClick={() => setNewFolderModal(false)} className="border border-slate-700 text-slate-400 px-3 py-1.5 rounded text-xs">✕</button>
          </div>
        </div>
      )}

      {/* Thanh tra cứu */}
      <div className="bg-slate-900/80 border border-slate-700 rounded p-3 mb-4">
        <div className="flex gap-2">
          <input
            type="text"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") handleLookup(); }}
            placeholder="Tra từ tiếng Trung (AI tự phân loại)..."
            className="flex-1 bg-slate-950 border border-slate-700 rounded px-3 py-2 text-sm text-[#F0E6D2] outline-none focus:border-[#C89B3C]"
          />
          <button
            onClick={handleLookup}
            disabled={looking || !query.trim()}
            className="bg-gradient-to-b from-[#C89B3C] to-[#A9791F] text-slate-950 font-bold px-4 rounded text-xs font-sans disabled:opacity-50"
          >
            {looking ? "Đang tra..." : "Tra cứu"}
          </button>
        </div>
        {lookupError && <div className="text-red-400 text-xs mt-2 font-sans">⚠ {lookupError}</div>}
      </div>

      {/* Bộ lọc & nút thêm */}
      <div className="flex justify-between items-center mb-3 gap-2 flex-wrap">
        <span className="text-xs text-slate-400 font-sans">📖 {filtered.length} mục trong [{activeFolder}]</span>
        <div className="flex gap-2">
          <input
            type="text"
            value={filter}
            onChange={(e) => setFilter(e.target.value)}
            placeholder="Lọc từ..."
            className="bg-slate-900 border border-slate-700 rounded px-2.5 py-1 text-xs text-[#F0E6D2] outline-none w-32"
          />
          <button onClick={() => setManualOpen(!manualOpen)} className="border border-[#0AC8B9] text-[#0AC8B9] px-2.5 py-1 rounded text-xs font-sans font-semibold hover:bg-[#0AC8B9]/10">
            + Thêm thủ công
          </button>
        </div>
      </div>

      {manualOpen && (
        <div className="bg-slate-900/90 border border-[#0AC8B9] rounded p-3 mb-4 space-y-2">
          <div className="flex gap-2">
            <input type="text" placeholder="Chữ Hán" value={manualDraft.word} onChange={(e) => setManualDraft({ ...manualDraft, word: e.target.value })} className="flex-1 bg-slate-950 border border-slate-700 rounded p-2 text-xs text-[#F0E6D2]" />
            <input type="text" placeholder="Pinyin" value={manualDraft.pinyin} onChange={(e) => setManualDraft({ ...manualDraft, pinyin: e.target.value })} className="flex-1 bg-slate-950 border border-slate-700 rounded p-2 text-xs text-[#F0E6D2]" />
          </div>
          <div className="flex gap-2">
            <input type="text" placeholder="Nghĩa" value={manualDraft.meaning} onChange={(e) => setManualDraft({ ...manualDraft, meaning: e.target.value })} className="flex-[2] bg-slate-950 border border-slate-700 rounded p-2 text-xs text-[#F0E6D2]" />
            <select value={manualDraft.folder} onChange={(e) => setManualDraft({ ...manualDraft, folder: e.target.value })} className="flex-1 bg-slate-950 border border-slate-700 rounded p-2 text-xs text-[#F0E6D2]">
              {folders.filter(f => f !== "Tất cả").map(f => <option key={f} value={f}>{f}</option>)}
            </select>
          </div>
          <textarea placeholder="Ghi chú..." value={manualDraft.note} onChange={(e) => setManualDraft({ ...manualDraft, note: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-xs text-[#F0E6D2] h-14" />
          <div className="flex gap-2 pt-1">
            <button onClick={addManual} className="bg-[#0AC8B9] text-slate-950 font-bold px-3 py-1 rounded text-xs font-sans">✓ Lưu</button>
            <button onClick={() => setManualOpen(false)} className="border border-slate-700 text-slate-400 px-3 py-1 rounded text-xs font-sans">✕ Huỷ</button>
          </div>
        </div>
      )}

      {/* Danh sách từ */}
      <div className="space-y-2.5">
        {loaded && filtered.length === 0 && (
          <div className="text-center text-slate-500 text-xs py-10 border border-dashed border-slate-800 rounded font-sans">
            Không có từ nào trong thư mục này.
          </div>
        )}
        {filtered.map((entry) => (
          <div key={entry.id} className="bg-slate-900/60 border border-slate-800 border-l-4 border-l-[#C89B3C] rounded p-3">
            <div className="flex justify-between items-start">
              <div>
                <span className="text-lg font-bold mr-2 text-[#F0E6D2]">{entry.word}</span>
                <span className="text-xs text-[#0AC8B9] font-sans mr-2">
                  {editingId === entry.id ? <input value={editDraft.pinyin} onChange={(e) => setEditDraft({ ...editDraft, pinyin: e.target.value })} className="bg-slate-950 border border-slate-700 px-1 py-0.5 rounded text-xs text-[#F0E6D2]" /> : entry.pinyin}
                </span>
                <span className="text-[10px] bg-[#C89B3C]/15 text-[#C89B3C] border border-[#C89B3C]/30 px-1.5 py-0.5 rounded font-sans">📁 {entry.folder || "Chung"}</span>
              </div>
              <div className="flex gap-1">
                {editingId === entry.id ? (
                  <>
                    <button onClick={() => saveEdit(entry.id)} className="bg-[#0AC8B9] text-slate-950 px-2 py-1 rounded text-xs font-bold">✓</button>
                    <button onClick={() => setEditingId(null)} className="border border-slate-700 text-slate-400 px-2 py-1 rounded text-xs">✕</button>
                  </>
                ) : (
                  <>
                    <button onClick={() => startEdit(entry)} className="border border-slate-700 text-slate-400 px-2 py-1 rounded text-xs hover:border-slate-500">✎</button>
                    <button onClick={() => deleteEntry(entry.id)} className="border border-red-900/50 text-red-400 px-2 py-1 rounded text-xs hover:bg-red-950/30">🗑</button>
                  </>
                )}
              </div>
            </div>
            {editingId === entry.id ? (
              <div className="mt-2 space-y-2">
                <div className="flex gap-2">
                  <input value={editDraft.meaning} onChange={(e) => setEditDraft({ ...editDraft, meaning: e.target.value })} className="flex-2 bg-slate-950 border border-slate-700 px-2 py-1 rounded text-xs text-[#F0E6D2]" placeholder="Nghĩa" />
                  <select value={editDraft.folder} onChange={(e) => setEditDraft({ ...editDraft, folder: e.target.value })} className="flex-1 bg-slate-950 border border-slate-700 px-2 py-1 rounded text-xs text-[#F0E6D2]">
                    {folders.filter(f => f !== "Tất cả").map(f => <option key={f} value={f}>{f}</option>)}
                  </select>
                </div>
                <textarea value={editDraft.note} onChange={(e) => setEditDraft({ ...editDraft, note: e.target.value })} className="w-full bg-slate-950 border border-slate-700 px-2 py-1 rounded text-xs text-[#F0E6D2] h-12" placeholder="Ghi chú" />
              </div>
            ) : (
              <>
                <p className="mt-1.5 text-sm text-[#E5DBC4] leading-relaxed">{entry.meaning}</p>
                {entry.note && <p className="mt-1 text-xs text-slate-400 font-sans italic">{entry.note}</p>}
              </>
            )}
          </div>
        ))}
      </div>

      {toast && <div className="fixed bottom-5 left-1/2 -translate-x-1/2 bg-[#0AC8B9] text-slate-950 px-4 py-2 rounded text-xs font-bold font-sans shadow-lg z-50">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<LolDictionary />);
</script>
</body>
</html>
